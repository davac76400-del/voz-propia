<div style="background:#070b16;padding:32px 16px;font-family:Segoe UI,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#0e1424;border:1px solid #243052;border-radius:24px;padding:36px 28px;">
    <p style="margin:0;color:#3df2a0;font-size:13px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;">Voz Propia</p>

    <p style="margin:12px 0 0;color:#b9c4e2;font-size:16px;line-height:1.5;">Escribe este código en la app:</p>
    <p style="margin:22px 0;text-align:center;"><span style="display:inline-block;padding:16px 26px;border-radius:18px;background:#16203a;border:1px solid #3df2a0;color:#ffffff;font-size:40px;font-weight:800;letter-spacing:.3em;">{{ .Token }}</span></p>
    <p style="margin:0;color:#8f9bbd;font-size:14px;line-height:1.5;">El código vence en una hora. Si no lo pediste tú, ignora este correo.</p>
